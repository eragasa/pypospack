[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypospack"
version = "0.1.0"
description = "Research tools for parameterizing interatomic potentials"
readme = "README.rst"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Eugene J. Ragasa", email = "eragasa@ufl.edu" },
]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6",
    "scipy>=1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
data = [
    "pandas>=2.0",
    "scikit-learn>=1.2",
]
structure = ["ase>=3.22"]
plot = [
    "bokeh>=3.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
]
mpi = ["mpi4py>=3.1"]
all = [
    "ase>=3.22",
    "bokeh>=3.0",
    "matplotlib>=3.7",
    "mpi4py>=3.1",
    "pandas>=2.0",
    "scikit-learn>=1.2",
]
dev = [
    "build>=1.2",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/eragasa/pypospack"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pypospack*"]
namespaces = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
