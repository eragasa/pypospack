schema_version = 1

[[rules]]
kind = "path-prefix"
reason = "generated-documentation-build"
values = ["docs/build"]

[[rules]]
kind = "exact-name"
reason = "known-generated-or-restricted-calculator-artifact"
values = [
    ".DS_Store",
    ".spyderproject",
    ".spyderworkspace",
    "CHG",
    "CHGCAR",
    "CONTCAR",
    "DOSCAR",
    "EIGENVAL",
    "IBZKPT",
    "OSZICAR",
    "OUTCAR",
    "PCDAT",
    "POTCAR",
    "PROCAR",
    "REPORT",
    "WAVECAR",
    "XDATCAR",
    "freq.dat",
    "group_vel.dat",
    "job.err",
    "job.out",
    "jobCompleted",
    "jobSubmitted",
    "lammps.out",
    "lattice.out",
    "log.lammps",
    "phon_lifetime.dat",
    "pyposmat.log",
    "pypospack.results.out",
    "restart.equil",
    "scatt.dat",
    "scatt_test.dat",
    "vasp.log",
    "vasprun.xml",
]

[[rules]]
kind = "path-regex"
reason = "python-cache"
values = ['(?:.*/)?__pycache__/.*']

[[rules]]
kind = "name-regex"
reason = "generated-result-or-cache-pattern"
values = [
    '^\._.*$',
    '.*\.py[co]$',
    '^dump\..+$',
    '^pyposmat\.(?:results|kde).*\.out$',
]

[[rules]]
kind = "path-regex"
reason = "generated-phonts-result-archive"
values = ['dev/phonts/visualization/.+\.tar']
